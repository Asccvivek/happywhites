<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <!-- Stylized Tooth Icon with H and W Monogram -->
  <g transform="translate(10, 5)">
    <!-- Tooth Outer Contour -->
    <path d="M 45 10 C 65 10, 80 20, 80 40 C 80 58, 70 70, 68 85 C 66 90, 58 92, 53 85 C 49 78, 47 65, 45 65 C 43 65, 41 78, 37 85 C 32 92, 24 90, 22 85 C 20 70, 10 58, 10 40 C 10 20, 45 10 Z" 
          fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Letter H inside upper section -->
    <path d="M 33 28 L 33 50 M 57 28 L 57 50 M 33 39 L 57 39" 
          stroke="#0050A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Letter W in root section (Red as on physical clinic board) -->
    <path d="M 27 57 L 34 78 L 45 62 L 56 78 L 63 57" 
          stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(105, 18)">
    <text x="0" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">HAPPY WHITES</text>
    <text x="2" y="58" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="12.5" fill="#38BDF8" letter-spacing="3.5">DENTAL CLINIC</text>
    <text x="2" y="74" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#94A3B8" letter-spacing="1">TRUSTED MULTISPECIALTY CLINIC</text>
  </g>
</svg>
